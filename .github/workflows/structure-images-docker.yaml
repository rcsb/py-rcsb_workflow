# Docker build and push workflow for the structure-images (molrender JPEG) image

name: Run CI/CD Docker Workflow (structure-images)

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - "structure-images/**"
      - ".github/workflows/structure-images-docker.yaml"
  push:
    branches:
      - master
      # Dev branch: pushes publish harbor.devops.k8s.rcsb.org/rcsb/structure-images:mt-claude-jpeg-etl-refactor-231a01
      - mt-claude/jpeg-etl-refactor-231a01
    paths:
      - "structure-images/**"
      - ".github/workflows/structure-images-docker.yaml"

jobs:
  run-workflow:
    name: "Run automated docker workflow"
    uses: rcsb/devops-cicd-github-actions/.github/workflows/workflow-docker.yaml@master
    with:
      dockerfile_location: "structure-images/Dockerfile"
      repo_project: "rcsb"
      docker_image_name: "structure-images"
      docker_build_context: "structure-images"
